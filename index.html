<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイPWAアプリ</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f0f0f0; }
        .btn { padding: 10px 20px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        iframe { display: block; margin: 20px auto; max-width: 100%; }
    </style>
</head>
<body>
    <h1>My First PWA!</h1>
    <p>これはSafariの枠なしで動くアプリです。</p>
    <button class="btn" onclick="alert('動いた！')">ボタンを押してね</button>
    
    <!-- ① Myinstants -->
    <iframe width="110" height="200" src="https://myinstants.com" frameborder="0" scrolling="no"></iframe>
    
    <!-- ② YouTube（安全な埋め込み専用URL） -->
    <iframe width="640" height="360" src="https://youtube.com" frameborder="0" allowfullscreen></iframe>
    
    <!-- ③ ニコニコ動画（安全なサムネイル専用URL） -->
    <iframe width="312" height="176" src="https://nicovideo.jp" scrolling="no" style="border:solid 1px #ccc;" frameborder="0">
        <a href="https://nicovideo.jp">笑いこらえない先輩BB+使用例</a>
    </iframe>
</body>
</html>
