<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイPWAアプリ</title>
    <!-- ① パスの先頭に「./」を追加 -->
    <link rel="manifest" href="./manifest.json">
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f0f0f0; }
        .btn { padding: 10px 20px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>My First PWA!</h1>
    <p>これはSafariの枠なしで動くアプリです。</p>
    <button class="btn" onclick="alert('動いた！')">ボタンを押してね</button>
    
    <iframe src="https://www.youtube.com/watch?v=76pvpgpkFa0" frameborder="0" scrolling="no"></iframe>
    <script type="application/javascript" src="https://nicovideo.jp"></script>
    <noscript><a href="https://nicovideo.jp">笑いこらえない先輩BB+使用例</a></noscript>
    

    <script>
        // ② パスの先頭に「./」を追加し、ファイル名を統一
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(() => console.log('PWA準備完了！'))
                .catch(err => console.error('エラー:', err));
        }
    </script>
</body>
</html>
